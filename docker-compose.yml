# Only the database. Port 5434 so it can run beside any other local PostgreSQL, and only open
# to this machine. The password is for this local container only, not a real secret.
services:
  db:
    image: postgres:17
    container_name: inventory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: inventory_dev
      POSTGRES_DB: inventory
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  inventory_data:
